<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#101828;background:#fff}
*{box-sizing:border-box}

</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #ffffff">

      <span style="font-weight: 700; font-size: 16px; color: #0B0B7E">Lawdemy</span>
    </div>
    <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 2px">
      <a href="Dashboard-Existing.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: #344054; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Dashboard</a>
      <a href="MyCourses-Existing.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #101828; background: #EAECF0; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"></path><path d="M8 9h6"></path></svg>My Courses</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: #344054; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></svg>Certifications</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: #344054; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Community</a>
    </nav>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: #344054; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>Support</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: #344054; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Settings</a>
      <button type="button" style="margin-top: 12px; display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #EAECF0; border-radius: 10px; background: #ffffff; font: inherit; text-align: left; cursor: pointer">
        <span style="width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1.5px solid #F26B1D; color: #C4320A; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">DJ</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">Daniel John</span><span style="font-size: 11px; color: #667085; overflow: hidden; text-overflow: ellipsis">danieljohn12@gmail.com</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
  </aside>
  <main style="flex: 999 1 560px; min-width: 0; padding: 20px 32px 56px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Courses-All.dc.html" aria-label="Back" style="width: 36px; height: 36px; border: 1px solid #EAECF0; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #344054"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <div style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap">
        <label style="display: flex; align-items: center; gap: 8px; height: 40px; width: 280px; max-width: 100%; padding: 0 12px; border: 1px solid #EAECF0; border-radius: 8px; background: #F9FAFB">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input type="search" aria-label="Search courses" placeholder="Search courses" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px">
        </label>
        <a href="Wishlist.dc.html" aria-label="Wishlist" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #344054"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-9-9a4.5 4.5 0 0 1 9-3 4.5 4.5 0 0 1 9 3c-2 4.6-9 9-9 9z"></path></svg></a>
        <a href="Cart-Empty.dc.html" aria-label="Cart" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #344054"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.2"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg></a>
        <a href="Notifications.dc.html" aria-label="Notifications" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #344054"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg></a>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Showing 25 results for:</h1>
      <div style="display: flex; gap: 8px">
        <a href="SortFilter.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid #0B0B7E; border-radius: 8px; background: #ffffff; color: #0B0B7E; font-size: 13px; font-weight: 600; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filter</a>
        <a href="SortFilter.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid #0B0B7E; border-radius: 8px; background: #ffffff; color: #0B0B7E; font-size: 13px; font-weight: 600; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"></path></svg>Sort</a>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <sc-for list="{{chips}}" as="f" hint-placeholder-count="6">
        <span style="display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 4px 0 10px; border: 1px solid #D0D5DD; border-radius: 6px; font-size: 12px; color: #344054">{{f.name}}<button type="button" aria-label="Remove filter {{f.name}}" onClick="{{f.remove}}" style="width: 22px; height: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
      </sc-for>
      <button type="button" onClick="{{clearAll}}" style="height: 30px; padding: 0 8px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 600; color: #0B0B7E; cursor: pointer">Clear all</button>
    </div>

    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 18px; font-weight: 600">{{sec.name}}</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px">
          <sc-for list="{{sec.courses}}" as="c" hint-placeholder-count="6">
            <article style="border: 1px solid #EAECF0; border-radius: 12px; background: #ffffff; box-shadow: 0 1px 3px rgba(16,24,40,0.08); overflow: hidden; display: flex; flex-direction: column">
              <div style="height: 150px; background: #2B2F36; display: flex; align-items: flex-end; padding: 10px"><span style="font-size: 11px; color: #D0D5DD">[Course image: library bust]</span></div>
              <div style="padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1">
                <h3 style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35">{{c.title}}</h3>
                <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #475467"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FDEAD7; color: #93370D; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.initials}}</span>{{c.instructor}}</div>
                <span style="font-size: 14px; font-weight: 700; color: #C4320A">₦22,900.00</span>
                <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
                  <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: #067647; color: #ffffff; font-size: 11px; font-weight: 600">New</span>
                  <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #475467"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-4M12 20v-9M19 20V5"></path></svg>Beginner</span>
                </div>
              </div>
            </article>
          </sc-for>
        </div>
        <sc-if value="{{sec.canLoad}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{sec.load}}" style="align-self: center; height: 40px; padding: 0 20px; border: 1px solid #0B0B7E; border-radius: 8px; background: #ffffff; color: #0B0B7E; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Load More</button>
        </sc-if>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      filters: ['Law Practice Areas', 'Cross-Sector & General Interest', 'Beginner', 'Paid', 'New Arrivals', 'Certificate: Yes'],
      more: {}
    };
  }
  renderVals() {
    const ppl = [['Linda Ekubo', 'LE'], ['Segun Bello', 'SB']];
    const mk = (titles) => titles.map((t, i) => ({ title: t, instructor: ppl[i % 2][0], initials: ppl[i % 2][1] }));
    const data = [
      { name: 'Law Practice Areas', base: ['Legal Framework for Startups and Business Formation', 'Understanding Corporate Liability and Risk Management', 'Contract Drafting and Negotiation for Corporations', 'Securities Regulation and Corporate Finance Law', 'Mergers, Acquisitions & Corporate Restructuring', 'Securities Regulation and Corporate Finance Law'], extra: ['Corporate Governance and Board Duties', 'Banking and Capital Markets Regulation', 'Commercial Dispute Resolution'] },
      { name: 'Cross Sector & General Interest', base: ['Data Protection Law and Policy: From GDPR to Global Standards', 'Privacy by Design: Embedding Data Protection in Product Development', 'Data Subject Rights and Compliance Mechanisms', 'Managing Data Breaches: Legal and Operational Response', 'Cross-Border Data Transfers and International Privacy', 'AI, Big Data & Data Privacy'], extra: [] }
    ];
    const f = this.state.filters;
    return {
      chips: f.map((n) => ({ name: n, remove: () => this.setState({ filters: f.filter((x) => x !== n) }) })),
      clearAll: () => this.setState({ filters: [] }),
      sections: data.map((s) => {
        const open = !!this.state.more[s.name];
        return {
          name: s.name,
          courses: mk(open ? s.base.concat(s.extra) : s.base),
          canLoad: !open && s.extra.length > 0,
          load: () => this.setState({ more: Object.assign({}, this.state.more, { [s.name]: true }) })
        };
      })
    };
  }
}
</script>
</body>
</html>
