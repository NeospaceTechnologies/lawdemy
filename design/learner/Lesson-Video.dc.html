<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lawdemy – Video lesson, expanded</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#101828;background:#fff}
*{box-sizing:border-box}
a{color:#0B0B7E}a:hover{color:#06065A}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #ffffff">
  <aside style="flex: 1 1 240px; background: #F9FAFB; border-right: 1px solid #EAECF0; padding: 20px 14px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 8px">
      <svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M2 2h6v16h12v6H5a3 3 0 0 1-3-3z" fill="#0B0B7E"></path><circle cx="16" cy="12" r="4.5" fill="#F26B1D"></circle></svg>
      <span style="font-weight: 700; font-size: 16px; color: #0B0B7E">Lawdemy</span>
    </div>
    <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 2px">
      <a href="Dashboard-Existing.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: #344054; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Dashboard</a>
      <a href="MyCourses-NewlyBought.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #101828; background: #EAECF0; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"></path><path d="M8 9h6"></path></svg>My Courses</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: #344054; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></svg>Certifications</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: #344054; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Community</a>
    </nav>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: #344054; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>Support</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: #344054; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Settings</a>
      <button type="button" style="margin-top: 12px; display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #EAECF0; border-radius: 10px; background: #ffffff; font: inherit; text-align: left; cursor: pointer">
        <span style="width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1.5px solid #F26B1D; color: #C4320A; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">DJ</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">Daniel John</span><span style="font-size: 11px; color: #667085; overflow: hidden; text-overflow: ellipsis">danieljohn12@gmail.com</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
  </aside>
  <main style="flex: 999 1 560px; min-width: 0; padding: 12px; display: flex">
    <div style="position: relative; flex: 1; min-height: 560px; border-radius: 12px; overflow: hidden; background: #2E2A27; display: flex; align-items: center; justify-content: center">
      <span style="position: absolute; left: 16px; top: 14px; font-size: 12px; color: #E4D9CE">[Lesson video: 1. Introduction to Litigation]</span>
      <button type="button" aria-label="{{playLabel}}" onClick="{{toggle}}" style="width: 64px; height: 64px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="#101828" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></sc-if>
        <sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="#101828" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg></sc-if>
      </button>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: linear-gradient(transparent, rgba(0,0,0,0.6)); display: flex; flex-direction: column; gap: 8px; color: #ffffff">
        <div role="slider" aria-label="Seek" aria-valuenow="{{pct}}" aria-valuemin="0" aria-valuemax="100" style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.35)"><div style="height: 4px; border-radius: 2px; background: #ffffff; width: {{width}}"></div></div>
        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px">
          <div style="display: flex; align-items: center; gap: 14px">
            <button type="button" aria-label="{{playLabel}}" onClick="{{toggle}}" style="width: 32px; height: 32px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
            <button type="button" aria-label="Back 10 seconds" style="width: 32px; height: 32px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"></path></svg></button>
            <span style="font-variant-numeric: tabular-nums">{{time}} / 3:12</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <button type="button" aria-label="Volume" style="width: 32px; height: 32px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6"></path></svg></button>
            <button type="button" aria-label="Settings" style="width: 32px; height: 32px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
            <a href="Lesson-Text.dc.html" aria-label="Exit full view" style="width: 32px; height: 32px; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path></svg></a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: false, t: 4 };
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const s = this.state;
    const pct = Math.round((s.t / 192) * 100);
    return {
      paused: !s.playing,
      playing: s.playing,
      playLabel: s.playing ? 'Pause' : 'Play',
      pct,
      width: pct + '%',
      time: Math.floor(s.t / 60) + ':' + String(s.t % 60).padStart(2, '0'),
      toggle: () => {
        if (s.playing) { clearInterval(this.timer); this.setState({ playing: false }); }
        else {
          this.timer = setInterval(() => this.setState({ t: (this.state.t + 1) % 193 }), 1000);
          this.setState({ playing: true });
        }
      }
    };
  }
}
</script>
</body>
</html>
