      <button type="button" style="margin-top: 12px; display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #EAECF0; border-radius: 10px; background: #ffffff; font: inherit; text-align: left; cursor: pointer">

      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">Certifications</h1>
      <p style="margin: 0; font-size: 14px; color: #475467">All your completed certificates in one place.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px">
      <sc-for list="{{certs}}" as="c" hint-placeholder-count="6">
        <article style="border: 1px solid #EAECF0; border-radius: 12px; overflow: hidden; background: #ffffff; box-shadow: 0 1px 3px rgba(16,24,40,0.08); display: flex; flex-direction: column">
          <div aria-hidden="true" style="height: 160px; display: flex; background: linear-gradient(135deg, #F1EDFB 0%, #ffffff 50%); border-bottom: 1px solid #EAECF0">
            <div style="flex: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px">
              <span style="font-family: 'Playfair Display', serif; font-size: 9px; letter-spacing: 0.06em; color: #344054">CERTIFICATE OF</span>
              <span style="font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 700; letter-spacing: 0.04em">COMPLETION</span>
              <span style="font-size: 7px; color: #667085; margin-top: 4px">This is proudly presented to</span>
              <span style="font-family: 'Great Vibes', cursive; font-size: 20px; line-height: 1">Daniel John</span>
              <span style="height: 3px; width: 80%; background: #EAECF0; border-radius: 2px; margin-top: 6px"></span>
              <span style="height: 3px; width: 65%; background: #EAECF0; border-radius: 2px"></span>

              <rect y="64" width="62" height="32" fill="#FFC21A"></rect><path d="M0 64l31 32H0z" fill="#F26B1D"></path><rect x="31" y="64" width="31" height="32" fill="#B8E6D3"></rect>
              <rect y="96" width="31" height="32" fill="#FFC21A"></rect><circle cx="62" cy="128" r="31" fill="#17B26A"></circle>
              <rect y="128" width="62" height="32" fill="#111827"></rect><path d="M0 128l15 32 16-32 15 32 16-32v32H0z" fill="#6B3FA0"></path>
            </svg>

            <h2 style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35">{{c.title}}</h2>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #475467"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Date Issued: <strong style="color: #101828; font-weight: 500">{{c.date}}</strong></span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #475467"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Instructor: <strong style="color: #101828; font-weight: 500">Segun Bello</strong></span>

          </div>
        </article>
