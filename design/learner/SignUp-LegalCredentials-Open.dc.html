<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lawdemy – Legal credentials, jurisdiction open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#101828;background:#fff}
*{box-sizing:border-box}
a{color:#0B0B7E}a:hover{color:#06065A}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #ffffff">
  <div style="flex: 1 1 420px; min-height: 320px; background: #3B2715; display: flex; flex-direction: column; justify-content: space-between; padding: 32px">
    <div style="align-self: flex-start; font-size: 12px; color: #F5E6D3; border: 1px dashed rgba(245,230,211,0.5); border-radius: 6px; padding: 6px 10px">[Hero photo: lawyer addressing the court]</div>
    <p style="margin: 0; max-width: 320px; color: #ffffff; font-size: 20px; font-weight: 600; line-height: 1.35">From learner to leader—your legal journey begins here.</p>
  </div>
  <div style="flex: 1.25 1 480px; display: flex; flex-direction: column; padding: 28px 48px 48px; background: radial-gradient(circle at 0% 0%, #EEEBFF 0%, #ffffff 38%)">
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 0">
      <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="display: flex; align-items: center; gap: 8px">
            <svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M2 2h6v16h12v6H5a3 3 0 0 1-3-3z" fill="#0B0B7E"></path><circle cx="16" cy="12" r="4.5" fill="#F26B1D"></circle></svg>
            <span style="font-weight: 700; font-size: 16px; color: #0B0B7E">Lawdemy</span>
          </div>
          <div style="display: flex; gap: 4px" aria-label="Step 3 of 4">
            <span style="width: 20px; height: 4px; border-radius: 2px; background: #F26B1D"></span>
            <span style="width: 20px; height: 4px; border-radius: 2px; background: #F26B1D"></span>
            <span style="width: 20px; height: 4px; border-radius: 2px; background: #F26B1D"></span>
            <span style="width: 20px; height: 4px; border-radius: 2px; background: #E4E7EC"></span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Legal Credentials</h1>
          <p style="margin: 0; font-size: 14px; color: #475467; line-height: 1.5">We’d love to know a bit about your legal background to tailor your experience.</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span id="jur-l" style="font-size: 13px; font-weight: 500">Jurisdiction</span>
          <button type="button" aria-labelledby="jur-l" aria-expanded="true" style="height: 44px; display: flex; align-items: center; justify-content: space-between; border: 1.5px solid #0B0B7E; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 14px; color: #667085; background: #ffffff; box-shadow: 0 0 0 4px #E7E7FB; cursor: pointer">Select where you’re authorised to practise law <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B0B7E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
          <div style="border: 1px solid #E4E7EC; border-radius: 10px; background: #ffffff; box-shadow: 0 12px 24px -6px rgba(16,24,40,0.14); padding: 8px; display: flex; flex-direction: column; gap: 2px">
            <div style="display: flex; align-items: center; gap: 8px; height: 38px; border: 1px solid #E4E7EC; border-radius: 6px; padding: 0 10px; margin-bottom: 4px">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
              <label for="jq" style="position: absolute; left: -9999px">Search jurisdiction</label>
              <input id="jq" type="search" placeholder="Search jurisdiction" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 13px; background: transparent">
            </div>
            <sc-for list="{{countries}}" as="c" hint-placeholder-count="8">
              <label style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 6px; font-size: 13px; background: {{c.bg}}; cursor: pointer">
                <input type="checkbox" checked="{{c.checked}}" style="width: 16px; height: 16px; accent-color: #0B0B7E; margin: 0">
                {{c.name}}
              </label>
            </sc-for>
          </div>
        </div>
        <span style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; background: #9D9DD0; color: #ffffff; font-weight: 600; font-size: 14px" aria-disabled="true">Continue</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1024}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Australia', 'Botswana', 'Brazil', 'Canada', 'Chile', 'Egypt', 'France', 'Germany'];
    return {
      countries: names.map((n) => ({ name: n, checked: n === 'Canada', bg: n === 'Canada' ? '#F2F4F7' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
