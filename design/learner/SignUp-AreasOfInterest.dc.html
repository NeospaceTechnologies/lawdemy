<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lawdemy – Areas of interest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#101828;background:#fff}
*{box-sizing:border-box}
a{color:#0B0B7E}a:hover{color:#06065A}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #ffffff">
  <div style="flex: 1 1 420px; min-height: 320px; background: #3B2715; display: flex; flex-direction: column; justify-content: space-between; padding: 32px">
    <div style="align-self: flex-start; font-size: 12px; color: #F5E6D3; border: 1px dashed rgba(245,230,211,0.5); border-radius: 6px; padding: 6px 10px">[Hero photo: lawyer addressing the court]</div>
    <p style="margin: 0; max-width: 320px; color: #ffffff; font-size: 20px; font-weight: 600; line-height: 1.35">From learner to leader—your legal journey begins here.</p>
  </div>
  <div style="flex: 1.25 1 480px; display: flex; flex-direction: column; padding: 28px 48px 48px; background: radial-gradient(circle at 0% 0%, #EEEBFF 0%, #ffffff 38%)">
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 0">
      <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="display: flex; align-items: center; gap: 8px">
            <svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M2 2h6v16h12v6H5a3 3 0 0 1-3-3z" fill="#0B0B7E"></path><circle cx="16" cy="12" r="4.5" fill="#F26B1D"></circle></svg>
            <span style="font-weight: 700; font-size: 16px; color: #0B0B7E">Lawdemy</span>
          </div>
          <div style="display: flex; gap: 4px" aria-label="Step 4 of 4">
            <span style="width: 20px; height: 4px; border-radius: 2px; background: #F26B1D"></span>
            <span style="width: 20px; height: 4px; border-radius: 2px; background: #F26B1D"></span>
            <span style="width: 20px; height: 4px; border-radius: 2px; background: #F26B1D"></span>
            <span style="width: 20px; height: 4px; border-radius: 2px; background: #F26B1D"></span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Areas of Interest</h1>
          <p style="margin: 0; font-size: 14px; color: #475467; line-height: 1.5">Choose the topics you’re most interested in. This helps us recommend the right courses for you.</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px" role="group" aria-label="Areas of interest">
          <sc-for list="{{topics}}" as="t" hint-placeholder-count="7">
            <button type="button" aria-pressed="{{t.on}}" onClick="{{t.toggle}}" style="{{t.style}}">{{t.name}}</button>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <a href="SignUp-LegalCredentials.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #0B0B7E; background: #ffffff; color: #0B0B7E; text-decoration: none; font-weight: 600; font-size: 14px">Back</a>
          <a href="SignUp-AllSet.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #0B0B7E; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px">Finish</a>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1024}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: ['Data Privacy', 'Human Rights'] };
  }
  renderVals() {
    const names = ['Ecosystem Law', 'Climate Litigation', 'Legal Tech', 'Data Privacy', 'Contract Drafting', 'Legal Writing', 'Human Rights'];
    const picked = this.state.picked;
    const base = 'height: 40px; padding: 0 16px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; ';
    return {
      topics: names.map((n) => {
        const on = picked.includes(n);
        return {
          name: n,
          on: on ? 'true' : 'false',
          style: base + (on ? 'background: #EEEEFB; border: 1.5px solid #0B0B7E; color: #0B0B7E' : 'background: #ffffff; border: 1px solid #D0D5DD; color: #344054'),
          toggle: () => this.setState({ picked: on ? picked.filter((p) => p !== n) : picked.concat(n) })
        };
      })
    };
  }
}
</script>
</body>
</html>
