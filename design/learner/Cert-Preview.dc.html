<script type="text/x-dc" data-dc-script data-props='{"audience":{"editor":"enum","options":["Non-lawyers","Lawyers"],"default":"Non-lawyers"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { downloaded: false };
  }
  renderVals() {
    const lawyer = (this.props.audience ?? 'Non-lawyers') === 'Lawyers';
    return {
      lawyer,
      closing: lawyer
        ? 'in recognition of their commitment to Continuous Legal Education (CLE) and professional growth.'
        : 'in recognition of their commitment to continuous learning and professional development.',
      downloadLabel: this.state.downloaded ? 'Downloaded' : 'Download Certificate',
      download: () => this.setState({ downloaded: true })
    };
  }
}
</script>
